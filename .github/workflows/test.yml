name: Test Suite
on:
  push:
    branches: [ main, master ]
    paths:
      - 'recovery-tools/vultisig-share-decoder/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'recovery-tools/vultisig-share-decoder/**'
      - '.github/workflows/test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: './recovery-tools/vultisig-share-decoder/go.mod'
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Run code checks and tests
      working-directory: ./recovery-tools/vultisig-share-decoder
      run: make check && make test-all