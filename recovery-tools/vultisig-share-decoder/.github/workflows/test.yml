name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recovery-tools/vultisig-share-decoder
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        
    - name: Run Go tests
      run: go test -v ./...

  test-js:
    name: JavaScript Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recovery-tools/vultisig-share-decoder
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: cd test && npm ci
      
    - name: Run JavaScript tests
      run: cd test && npm test

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [test-go, test-js]
    defaults:
      run:
        working-directory: recovery-tools/vultisig-share-decoder
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        
    - name: Build webserver
      run: make webserver
      
    - name: Build WASM
      run: make wasm
      
    - name: Verify build artifacts
      run: |
        test -f dist/webserver
        test -f web/main.wasm
        echo "✅ All build artifacts created successfully"
